<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Demiurges">
<meta name="theme-color" content="#0f1118">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Etherlords Duel</title>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<style>
html,body{margin:0;position:fixed;inset:0;overflow:hidden;background:#0f1118;color:#d9dcea;font:16px system-ui;overscroll-behavior:none}
#canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#start{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;gap:16px;background:#0f1118;z-index:4;overflow:auto}
button{font:inherit;color:inherit;background:#262b3d;border:1px solid #6f7aa8;padding:12px 20px;border-radius:5px;min-height:48px}
button:disabled{opacity:.6}#bar{height:6px;background:#262b3d;border-radius:3px;overflow:hidden}#bar>div{height:100%;width:0;background:#8fa3e8;transition:width .2s}#bar[hidden]{display:none}
#notice{max-width:38em;white-space:pre-wrap}#safe-probe{position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#runtime-error{position:fixed;bottom:env(safe-area-inset-bottom);left:10%;right:10%;background:#4a1d22;color:white;z-index:5}#runtime-error:empty{display:none}
#rotate{display:none;position:fixed;inset:0;background:#0f1118eb;z-index:6;align-content:center;text-align:center;padding:32px}
#start,#rotate{padding-left:max(24px,env(safe-area-inset-left),env(safe-area-inset-right));padding-right:max(24px,env(safe-area-inset-left),env(safe-area-inset-right));padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
@media(orientation:portrait) and (pointer:coarse){#rotate{display:block}}
</style></head><body>
<canvas id="canvas" tabindex="0">This game requires WebGL 2.</canvas>
<div id="safe-probe"></div><div id="runtime-error" role="alert"></div>
<div id="rotate">Turn your device sideways to play.<p><button onclick="this.parentElement.parentElement.style.display='none'">Continue upright</button></p></div>
<div id="start"><h1>Demiurges</h1><div id="notice">Preparing…</div><div id="bar" hidden><div></div></div><button id="play">Play</button><button onclick="EtherFiles.fullscreen()">Fullscreen / Home Screen</button></div>
<script src="storage.js"></script><script src="files.js"></script><script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":2031836,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const notice = document.getElementById('notice'), play = document.getElementById('play'), bar = document.getElementById('bar');
const WELCOME = 'Fan engine for Etherlords I and II. Use the files of your own copy of the games; they stay on this device.\nOn iPhone or iPad: Share → Add to Home Screen → Open as Web App.';
// Play is accepted at any time: pressed early, it waits (with progress) until
// the engine is downloaded and loaded, then starts. It never returns to the
// Play state; a failure offers a reload instead.
let ready = false, wanted = false, starting = false, failed = false, label = 'Preparing', percent = null;
function show() {
  if (failed) return;
  const text = label + '…' + (percent === null ? '' : ' ' + percent + '%');
  const idle = ready && !starting;
  bar.hidden = idle || percent === null; bar.firstChild.style.width = (percent || 0) + '%';
  notice.textContent = idle ? WELCOME : text;
  if (starting) play.textContent = 'Starting…';
  else if (wanted) play.textContent = text;
}
function progress(text, loaded, total) {
  label = text; percent = total > 0 ? Math.min(100, Math.floor(loaded / total * 100)) : null; show();
}
function fail(error) {
  failed = true; bar.hidden = true;
  notice.textContent = (error && error.message) || String(error);
  play.textContent = 'Reload'; play.disabled = false;
}
const engine = new Engine(Object.assign({}, GODOT_CONFIG, {onProgress: (loaded, total) => progress('Loading the engine', loaded, total)}));
function start() {
  starting = true; play.disabled = true; label = 'Loading'; percent = null; show();
  engine.startGame({onProgress: (loaded, total) => progress('Loading', loaded, total)})
    .then(() => { document.getElementById('start').remove(); document.getElementById('canvas').focus(); })
    .catch(fail);
}
EtherFiles.initialize((loaded, total) => progress('Downloading the game', loaded, total))
  .then(() => { progress('Loading the engine', 0, 0); return engine.init(GODOT_CONFIG.executable); })
  .then(() => { EtherFiles.mount(engine.rtenv && engine.rtenv.ELFS); ready = true; if (wanted) start(); else show(); })
  .catch(fail);
play.addEventListener('click', () => {
  if (failed) { location.reload(); return; }
  if (starting || (wanted && !ready)) return;
  wanted = true;
  if (ready) start(); else { play.disabled = true; show(); }
});
</script></body></html>
