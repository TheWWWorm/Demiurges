# Serves the prepared Web export in public/ as Workers static assets.
# Cloudflare deploys it from this repository on every push; public/ is the
# committed, already built export. worker.js streams engine files that were
# split to stay under the asset size limit (see parts.json) and adds the
# headers the engine needs.
name = "demiurges"
main = "worker.js"
compatibility_date = "2026-10-09"
workers_dev = false
routes = [{ pattern = "demiurges.wwworm.com", custom_domain = true }]

# Online play relay rooms (see RelayRoom in worker.js).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[migrations]]
tag = "relay-v1"
new_sqlite_classes = ["RelayRoom"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
